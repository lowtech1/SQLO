    <title>LLM-R2 Dashboard</title>
    <!-- Prevent flash of wrong theme by reading localStorage before render -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('llm-r2-theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
